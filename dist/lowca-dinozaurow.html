<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123C38">
<title>Łowca Dinozaurów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ================= ŁOWCA DINOZAURÓW – wykopalisko =================
   Motyw: warstwy skalne (strata), płyty z odciskiem skamieniałości,
   bursztynowy akcent, tusz w kolorze petrol green. */

:root{
  --ink:#123C38;
  --ink-soft:#3E635E;
  --amber:#F5A524;
  --amber-dk:#C97C0B;
  --paper:#F6EFE0;
  --paper-2:#EFE5D2;
  --stone:#E2D5BC;
  --stone-dk:#CBB998;
  --line:#D6C6A8;
  --shadow:0 2px 0 rgba(18,60,56,.10), 0 8px 22px rgba(18,60,56,.10);
  --r:18px;
  --font-h:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-b:'Nunito', system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-b);
  color:var(--ink);
  background:var(--paper);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,strong.big{font-family:var(--font-h);letter-spacing:.2px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* --- tło: warstwy skalne --- */
.strata{
  position:fixed;inset:0;z-index:-1;
  background:
    linear-gradient(#F8F2E5 0 42%, #F2E9D6 42% 58%, #EADFC7 58% 72%, #E3D5B9 72% 84%, #D9C9A9 84% 100%);
}
.strata::after{
  content:'';position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 12% 68%, rgba(160,132,92,.20) 0 6px, transparent 7px),
    radial-gradient(circle at 78% 76%, rgba(160,132,92,.16) 0 9px, transparent 10px),
    radial-gradient(circle at 40% 88%, rgba(140,112,72,.16) 0 5px, transparent 6px),
    radial-gradient(circle at 62% 94%, rgba(140,112,72,.13) 0 11px, transparent 12px),
    radial-gradient(circle at 22% 92%, rgba(140,112,72,.13) 0 7px, transparent 8px);
}

/* ================= NAGŁÓWEK ================= */
.top{
  background:var(--ink);
  color:#F6EFE0;
  border-bottom:5px solid var(--amber);
  position:sticky;top:0;z-index:40;
  box-shadow:0 6px 18px rgba(18,60,56,.22);
}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-badge{width:46px;height:46px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border-radius:14px;padding:4px}
.brand-badge svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.brand h1{font-size:22px;margin:0;line-height:1.05;color:#FFF6E4}
.tagline{margin:1px 0 0;font-size:12px;color:#9EC4BC;font-weight:700}
.top-actions{display:flex;gap:8px;flex:0 0 auto}
.icon-btn{
  background:rgba(255,255,255,.10);color:#F6EFE0;border:2px solid rgba(255,255,255,.20);
  border-radius:12px;padding:7px 11px;font-weight:800;font-size:13px;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.icon-btn svg{width:18px;height:18px;display:block;flex:0 0 auto}
.icon-btn span{display:none}
@media(min-width:560px){.icon-btn span{display:inline}}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.icon-btn.on{background:var(--amber);border-color:var(--amber);color:#3A2405}

/* ================= ŁOWY ================= */
.hunt{padding:20px 0 4px;text-align:center}
.search-pill{
  display:flex;align-items:center;gap:8px;
  background:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:5px 5px 5px 16px;box-shadow:var(--shadow);
  max-width:560px;margin:0 auto;transition:.15s;
}
.search-pill:focus-within{box-shadow:0 0 0 4px rgba(245,165,36,.35), var(--shadow)}
.search-pill.shake{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(3px)}
}
.mag{font-size:18px;opacity:.55}
#q{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font:700 17px/1.2 var(--font-b);color:var(--ink);padding:10px 0;
}
#q::placeholder{color:#9AA9A4;font-weight:600}
.go{
  background:var(--amber);border:0;border-radius:999px;
  padding:11px 22px;font:800 16px var(--font-h);color:#3A2405;
  box-shadow:0 3px 0 var(--amber-dk);transition:.1s;
}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--amber-dk)}

.sugg{
  max-width:560px;margin:8px auto 0;background:#fff;border:2px solid var(--line);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-align:left;
}
.sugg button{
  display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;
  padding:9px 14px;font:700 15px var(--font-b);color:var(--ink);border-bottom:1px solid var(--paper-2);
}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--paper-2)}
.sugg .s-lat{font-weight:400;font-size:12px;color:#8C9A96;font-style:italic}
.sugg .s-got{margin-left:auto;font-size:12px;color:#5E8F55;font-weight:800}

.hunt-msg{min-height:22px;margin:10px 0 0;font-weight:800;font-size:15px;color:var(--ink-soft)}
.hunt-msg.bad{color:#B24A34}
.hunt-msg.good{color:#3F7A3A}

/* ================= POSTĘP ================= */
.progress-card{
  background:#fff;border:3px solid var(--ink);border-radius:var(--r);
  padding:14px 16px 12px;margin:16px 0 18px;box-shadow:var(--shadow);
}
.pc-head{display:flex;align-items:center;gap:12px}
.pc-egg{width:46px;height:46px;flex:0 0 auto}
.pc-egg svg{width:100%;height:100%;display:block}
.pc-txt{display:flex;flex-direction:column;line-height:1.15}
.pc-txt strong{font-family:var(--font-h);font-size:26px}
.pc-txt span{font-size:13px;color:var(--ink-soft);font-weight:700}
.pc-rank{
  margin-left:auto;background:var(--paper-2);border:2px solid var(--line);
  border-radius:999px;padding:6px 13px;font:800 13px var(--font-b);color:var(--ink-soft);
  text-align:center;
}

/* pasek postępu = warstwa skalna, w której odkrywasz jaja */
.rockbar{
  position:relative;height:26px;margin-top:12px;border-radius:999px;overflow:visible;
  background:
    repeating-linear-gradient(90deg, #DCCDB0 0 12px, #D5C4A4 12px 24px),
    #DCCDB0;
  border:2px solid var(--stone-dk);
  box-shadow:inset 0 3px 6px rgba(90,70,40,.18);
}
.rock-fill{
  position:absolute;inset:2px auto 2px 2px;width:0;border-radius:999px;
  background:linear-gradient(180deg,#FFC661,var(--amber) 55%,#DE8E10);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.10);
  transition:width .7s cubic-bezier(.3,1.4,.5,1);
}
.rock-marks{position:absolute;inset:0}
.rock-marks i{
  position:absolute;top:50%;translate:-50% -50%;
  width:24px;height:24px;display:block;transition:.35s;opacity:.42;
}
.rock-marks i svg{width:100%;height:100%;display:block}
.rock-marks i.hit{opacity:1;scale:1.3;filter:drop-shadow(0 0 6px rgba(255,240,190,.95))}
.pc-note{margin:9px 0 0;font-size:12px;color:#8C9A96;text-align:center;font-weight:600}

/* ================= FILTRY ================= */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:#fff;border:2px solid var(--line);border-radius:999px;
  padding:7px 14px;font:800 13px var(--font-b);color:var(--ink-soft);transition:.12s;
}
.chip:hover{border-color:var(--stone-dk)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#FFF6E4}
.chip b{opacity:.6;font-weight:800;margin-left:5px;font-size:11px}
.miss{margin-left:auto;display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;color:var(--ink-soft);cursor:pointer}
.miss input{width:17px;height:17px;accent-color:var(--ink)}

/* ================= SIATKA ================= */
.grid{
  display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  padding-bottom:8px;
}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}}

.tile{
  position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:8px 6px 7px;text-align:center;transition:.14s;overflow:hidden;
  box-shadow:0 2px 0 rgba(18,60,56,.07);
}
/* płyta z odciskiem skamieniałości dla niezłapanych */
.tile.ghost{
  background:
    repeating-linear-gradient(115deg, rgba(203,185,152,.30) 0 8px, rgba(203,185,152,0) 8px 17px),
    var(--paper-2);
  border-style:dashed;border-color:var(--stone-dk);
}
.tile:hover{transform:translateY(-3px);border-color:var(--ink);box-shadow:0 6px 16px rgba(18,60,56,.16)}
.tile .art{display:block;width:100%;aspect-ratio:200/140}
.tile .art svg{width:100%;height:100%;display:block}
.tile .nm{
  display:block;margin-top:3px;font:800 12.5px/1.15 var(--font-b);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tile.ghost .nm{color:#9A8B70;font-weight:800;letter-spacing:1px}
.tile .no{position:absolute;top:5px;left:7px;font:800 10px var(--font-b);color:#BCAF93}
.rar{position:absolute;top:5px;right:6px;display:flex;gap:1.5px}
.rar i{width:5px;height:5px;border-radius:50%;background:var(--amber);display:block}
.tile.ghost .rar i{background:#C6B593}
.tile.ghost .grp{opacity:.45}
.tile .grp{
  position:absolute;bottom:6px;right:6px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.75);
}
.tile .del{
  position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
  background:#C4523C;color:#fff;border:0;font:900 12px var(--font-b);display:none;z-index:2;
}
body.editing .tile .del{display:block}
body.editing .rar{display:none}
.tile.fresh{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}

.empty{text-align:center;color:#8C9A96;font-weight:700;padding:30px 0}
.foot{padding:22px 0 40px;text-align:center;color:#8C9A96;font-size:12.5px;font-weight:600;line-height:1.5}
.foot b{color:var(--ink-soft)}

/* ================= SCENA ŁAPANIA ================= */
.catch-scene{
  position:fixed;inset:0;z-index:80;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.scene-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%, #2C6A63, #0E2E2B 72%);opacity:0;animation:fadeIn .3s forwards}
@keyframes fadeIn{to{opacity:1}}
.scene-ground{
  position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(#8A6A44,#5E4527);
  box-shadow:inset 0 6px 0 rgba(0,0,0,.15);
}
.scene-target{
  position:relative;z-index:2;width:min(74vw,420px);aspect-ratio:200/140;
  opacity:0;transform:scale(.4);
}
.scene-target svg{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.4))}
.scene-target.silhouette{filter:brightness(0) invert(.18) sepia(1) saturate(.2)}
.scene-target.show{animation:reveal .8s cubic-bezier(.25,1.5,.45,1) forwards}
@keyframes reveal{0%{opacity:0;transform:scale(.35) rotate(-8deg)}60%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1)}}
.scene-target.idle{opacity:.55;transform:scale(.95);animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:scale(.95) translateY(0)}50%{transform:scale(.95) translateY(-10px)}}

.scene-egg{
  position:absolute;z-index:3;width:min(20vw,92px);left:50%;bottom:10%;
  translate:-50% 0;opacity:0;
}
.scene-egg svg{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.scene-egg.throw{animation:throwEgg .62s cubic-bezier(.3,.1,.7,.9) forwards}
@keyframes throwEgg{
  0%{opacity:1;bottom:2%;left:14%;transform:scale(.55) rotate(0)}
  55%{bottom:62%;left:36%;transform:scale(.9) rotate(320deg)}
  100%{opacity:1;bottom:34%;left:50%;transform:scale(1) rotate(720deg)}
}
.scene-egg.wobble,.scene-egg.gone{opacity:1;left:50%;bottom:34%;transform:scale(1)}
.scene-egg.wobble{animation:wob .42s ease-in-out 3}
@keyframes wob{0%,100%{rotate:0}25%{rotate:-17deg}75%{rotate:17deg}}
.scene-egg.gone{animation:eggPop .35s forwards}
@keyframes eggPop{to{opacity:0;transform:scale(1.5)}}

.scene-flash{
  position:absolute;z-index:4;width:26px;height:26px;border-radius:50%;
  left:50%;top:50%;translate:-50% -50%;background:#FFF3D0;opacity:0;
}
.scene-flash.on{animation:flash .7s ease-out forwards}
@keyframes flash{0%{opacity:1;transform:scale(0)}70%{opacity:.85}100%{opacity:0;transform:scale(34)}}

.scene-name{
  position:absolute;z-index:5;bottom:11%;left:0;right:0;text-align:center;margin:0;
  font:800 clamp(22px,6vw,40px) var(--font-h);color:#FFF6E4;
  text-shadow:0 3px 0 rgba(0,0,0,.35);opacity:0;
}
.scene-name.show{animation:nameIn .5s .1s forwards}
@keyframes nameIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.scene-hint{
  position:absolute;z-index:5;bottom:5%;left:0;right:0;text-align:center;margin:0;
  font:700 13px var(--font-b);color:#9EC4BC;
}

.confetti{position:absolute;inset:0;z-index:6;pointer-events:none}
.confetti i{position:absolute;width:11px;height:15px;border-radius:2px;opacity:0}
.confetti i.go{animation:conf 1.5s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{
  0%{opacity:1;transform:translate(0,0) rotate(0)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}

/* ================= MODAL ================= */
.modal{
  position:fixed;inset:0;z-index:90;background:rgba(12,36,33,.62);
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fadeIn .18s;overflow-y:auto;
}
.modal-card{
  position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  width:min(520px,100%);max-height:92vh;overflow-y:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:cardIn .28s cubic-bezier(.25,1.4,.5,1);
}
@keyframes cardIn{from{transform:scale(.88) translateY(14px);opacity:0}}
.close{
  position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;
  background:#fff;border:2px solid var(--line);font:800 14px var(--font-b);color:var(--ink-soft);
}
.close:hover{background:var(--paper-2)}

.m-hero{
  background:linear-gradient(#EFE6D3,#E4D7BC);border-bottom:3px solid var(--ink);
  padding:14px 16px 6px;border-radius:19px 19px 0 0;
}
.m-hero .art{width:100%;aspect-ratio:200/140;max-height:210px}
.m-hero .art svg{width:100%;height:100%;display:block}
.m-body{padding:14px 18px 18px}
.m-body h2{margin:0;font-size:26px;line-height:1.1}
.m-lat{margin:2px 0 10px;font-style:italic;color:#8C9A96;font-weight:700;font-size:14px}
.m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{border-radius:999px;padding:5px 11px;font:800 12px var(--font-b);color:#fff}
.tag.light{background:#fff;color:var(--ink-soft);border:2px solid var(--line)}
.m-fact{
  background:#fff;border:2px solid var(--line);border-left:6px solid var(--amber);
  border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.5;font-weight:600;
}
.m-fact b{display:block;font-family:var(--font-h);font-size:13px;color:var(--amber-dk);margin-bottom:2px;letter-spacing:.6px}
.m-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 11px}
.stat span{display:block;font-size:11px;color:#8C9A96;font-weight:800;letter-spacing:.5px}
.stat b{font-family:var(--font-h);font-size:19px}
.m-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  border:0;border-radius:12px;padding:11px 16px;font:800 14px var(--font-b);
  background:var(--ink);color:#FFF6E4;box-shadow:0 3px 0 rgba(0,0,0,.2);
}
.btn.amber{background:var(--amber);color:#3A2405;box-shadow:0 3px 0 var(--amber-dk)}
.btn.ghost{background:#fff;color:var(--ink-soft);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:#C4523C;color:#fff}
.btn:active{transform:translateY(2px);box-shadow:none}

/* podpowiedź dla niezłapanego */
.m-hint{
  background:#fff;border:2px dashed var(--stone-dk);border-radius:14px;
  padding:14px;text-align:center;
}
.m-hint .q{font:800 40px var(--font-h);color:var(--stone-dk);margin:0 0 6px}
.m-hint p{margin:0;font-size:15.5px;font-weight:700;line-height:1.5}
.m-hint .lbl{font-size:11px;letter-spacing:1.4px;color:var(--amber-dk);font-weight:900;margin-bottom:6px}
.m-hint .more{margin-top:10px;font-size:13.5px;color:var(--ink-soft);font-weight:700}
.hint-fields{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.hint-fields span{background:var(--paper-2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--ink-soft)}

/* ================= TRYB RODZICA ================= */
.edit-bar{
  background:#FFF3D8;border:3px solid var(--amber);border-radius:var(--r);
  padding:13px 15px;margin-bottom:16px;
}
.edit-bar h3{margin:0 0 4px;font-size:17px}
.edit-bar p{margin:0 0 11px;font-size:13px;color:var(--ink-soft);font-weight:700}
.eb-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.eb-row input,.eb-row select{
  border:2px solid var(--line);border-radius:10px;padding:9px 11px;
  font:700 14px var(--font-b);color:var(--ink);background:#fff;min-width:0;
}
.eb-row input{flex:1 1 150px}
.eb-row select{flex:1 1 170px}
.eb-tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:2px dashed #E3CFA2}

/* ================= ARENA ================= */
.arena{padding:2px 0 6px}
.ar-slots{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.ar-slot{
  background:#fff;border:3px dashed var(--line);border-radius:16px;padding:8px;text-align:center;
  min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ar-slot.filled{border-style:solid;border-color:var(--ink)}
.ar-slot .art{width:100%;aspect-ratio:200/140}
.ar-slot .art svg{width:100%;height:100%;display:block}
.ar-slot .nm{font:800 13px var(--font-b);margin-top:2px}
.ar-slot .ph{color:#A99A7E;font-weight:800;font-size:13px}
.ar-vs{font:900 22px var(--font-h);color:var(--amber-dk)}
.ar-log{
  margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:12px 14px;font-size:14px;font-weight:700;line-height:1.6;min-height:56px;
}
.ar-log .win{color:#3F7A3A;font-weight:900}
.ar-log .li{display:block}
.ar-pick{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;
  max-height:230px;overflow-y:auto;margin-top:12px;padding:4px;
  background:var(--paper-2);border-radius:14px;
}
.ar-pick button{background:#fff;border:2px solid var(--line);border-radius:11px;padding:4px;text-align:center}
.ar-pick button:hover{border-color:var(--ink)}
.ar-pick .art{width:100%;aspect-ratio:200/140}
.ar-pick .art svg{width:100%;height:100%;display:block}
.ar-pick .nm{font:800 10px var(--font-b);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-fight{animation:fight .5s ease-in-out 2}
@keyframes fight{0%,100%{transform:none}30%{transform:translateX(9px) rotate(2deg)}70%{transform:translateX(-9px) rotate(-2deg)}}

.type-legend span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 9px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}

<body>

<div class="strata" aria-hidden="true"></div>

<header class="top">
  <div class="wrap top-in">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5.5 5 18.5 19"/><path d="M18.5 5 5.5 19"/></g>
          <g fill="currentColor"><circle cx="4.1" cy="6.4" r="2.5"/><circle cx="6.9" cy="3.6" r="2.5"/>
          <circle cx="17.1" cy="20.4" r="2.5"/><circle cx="19.9" cy="17.6" r="2.5"/>
          <circle cx="17.1" cy="3.6" r="2.5"/><circle cx="19.9" cy="6.4" r="2.5"/>
          <circle cx="4.1" cy="17.6" r="2.5"/><circle cx="6.9" cy="20.4" r="2.5"/></g>
        </svg><span>Arena</span></button>
      <button class="icon-btn" id="btnEdit" title="Tryb rodzica">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h5M13 6h8M3 12h11M19 12h2M3 18h3M11 18h10"/>
          <circle cx="10.5" cy="6" r="2.4" fill="currentColor" stroke="none"/>
          <circle cx="16.5" cy="12" r="2.4" fill="currentColor" stroke="none"/>
          <circle cx="8.5" cy="18" r="2.4" fill="currentColor" stroke="none"/>
        </svg><span>Rodzic</span></button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ŁOWY -->
  <section class="hunt">
    <form id="huntForm" autocomplete="off">
      <div class="search-pill">
        <span class="mag" aria-hidden="true">🔍</span>
        <input id="q" type="text" placeholder="Jakiego dinozaura szukasz?" aria-label="Nazwa dinozaura" enterkeyhint="search">
        <button type="submit" class="go">Szukaj</button>
      </div>
    </form>
    <div id="sugg" class="sugg" hidden></div>
    <p id="huntMsg" class="hunt-msg" role="status" aria-live="polite"></p>
  </section>

  <!-- POSTĘP -->
  <section class="progress-card">
    <div class="pc-head">
      <div class="pc-egg" id="pcEgg"></div>
      <div class="pc-txt">
        <strong id="pcCount">0/116</strong>
        <span>złapanych zwierzaków</span>
      </div>
      <div class="pc-rank" id="pcRank">Praktykant</div>
    </div>
    <div class="rockbar" id="rockbar">
      <div class="rock-fill" id="rockFill"></div>
      <div class="rock-marks" id="rockMarks"></div>
    </div>
    <p class="pc-note">Postęp zapisuje się w tej przeglądarce</p>
  </section>

  <!-- FILTRY -->
  <section class="filters">
    <div class="chips" id="chips"></div>
    <label class="miss">
      <input type="checkbox" id="onlyMissing"> tylko brakujące
    </label>
  </section>

  <!-- SIATKA -->
  <section class="grid" id="grid"></section>
  <p class="empty" id="emptyMsg" hidden>Nic tu nie ma – zmień filtr.</p>

  <footer class="foot">
    <p>Mezozoik i kilku słynnych gości z innych epok. Pterozaury, gady morskie i dimetrodon <b>nie są dinozaurami</b> – mają własne etykiety.</p>
  </footer>
</main>

<!-- SCENA ŁAPANIA -->
<div class="catch-scene" id="scene" hidden>
  <div class="scene-sky"></div>
  <div class="scene-ground"></div>
  <div class="scene-target" id="sceneTarget"></div>
  <div class="scene-egg" id="sceneEgg"></div>
  <div class="scene-flash" id="sceneFlash"></div>
  <p class="scene-name" id="sceneName"></p>
  <div class="confetti" id="confetti"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="close" id="modalClose" aria-label="Zamknij">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

/* ---------- konwersja na obiekty ---------- */
function mkSpecies(row) {
  const [id, pl, lat, a, o, h, f, r, t, g, d, sz, alias] = row;
  return { id, pl, lat, a, o: o || {}, h, f, r, t, g, d, sz, alias: alias || [], pw: power(sz, t) };
}
function power(sz, t) {
  let v = 2 + 4 * Math.log10((sz || 1) + 1);
  if (t === 'drap') v += 2;
  if (t === 'pancerz') v += 1.2;
  if (t === 'olbrzym') v += 0.6;
  return Math.max(1, Math.min(12, Math.round(v)));
}

const SPECIES = RAW.map(mkSpecies);
const BY_ID = Object.fromEntries(SPECIES.map(s => [s.id, s]));

const Store = (function () {
  const KEY = 'dinoTracker.v1';
  let mem = null;
  function backend() {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; }
    catch (e) { return (typeof window !== 'undefined' && window.storage) || null; }
  }
  const be = backend();
  return {
    load() {
      if (mem) return mem;
      let raw = null;
      try { raw = be && be.getItem(KEY); } catch (e) {}
      try { mem = raw ? JSON.parse(raw) : null; } catch (e) { mem = null; }
      if (!mem || typeof mem !== 'object') mem = {};
      mem.caught = mem.caught || {};   // id -> {t: timestamp, pal:[..]}
      mem.added = mem.added || [];     // własne gatunki (tryb rodzica)
      mem.removed = mem.removed || []; // ukryte gatunki
      mem.wins = mem.wins || {};       // id -> liczba zwycięstw w arenie
      return mem;
    },
    save() {
      try { be && be.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
    },
    reset() { mem = null; try { be && be.removeItem(KEY); } catch (e) {} }
  };
})();

/* ---------------- normalizacja i wyszukiwanie ---------------- */
const PL_MAP = { 'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z' };
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[ąćęłńóśźż]/g, c => PL_MAP[c])
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '');
}
function lev(a, b) {
  if (a === b) return 0;
  if (Math.abs(a.length - b.length) > 3) return 9;
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, i) => i), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    const t = prev; prev = cur; cur = t;
  }
  return prev[n];
}
function keysOf(sp) {
  if (!sp._k) sp._k = [sp.pl, sp.lat, ...(sp.alias || [])].map(norm).filter(Boolean);
  return sp._k;
}
/* zwraca posortowaną listę trafień: 0 = dokładne, 1 = początek, 2 = zawiera, 3+ = literówka */
function search(qRaw, pool) {
  const q = norm(qRaw);
  if (q.length < 2) return [];
  const out = [];
  for (const sp of pool) {
    let best = 99;
    for (const k of keysOf(sp)) {
      if (k === q) { best = 0; break; }
      if (k.startsWith(q) && q.length >= 3) best = Math.min(best, 1);
      else if (k.includes(q) && q.length >= 4) best = Math.min(best, 2);
      else {
        const d = lev(q, k);
        const tol = q.length <= 5 ? 1 : (q.length <= 9 ? 2 : 3);
        if (d <= tol) best = Math.min(best, 2 + d);
      }
    }
    if (best < 99) out.push({ sp, score: best });
  }
  out.sort((a, b) => a.score - b.score || a.sp.pl.localeCompare(b.sp.pl, 'pl'));
  return out;
}

}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function visible() {
  let out = LIST;
  if (filter !== 'all') out = out.filter(s => s.g === filter);
  if (el.onlyMissing.checked) out = out.filter(s => !isCaught(s.id));
  return out;
}
function renderGrid(freshId) {
  const list = visible();
  el.grid.innerHTML = list.map((s, i) => tileHTML(s, LIST.indexOf(s))).join('');
  el.empty.hidden = list.length > 0;
  if (freshId) {

function renderChips() {
  const counts = { all: LIST.length };
  for (const k of Object.keys(GROUPS)) counts[k] = LIST.filter(s => s.g === k).length;
  const got = k => LIST.filter(s => (k === 'all' || s.g === k) && isCaught(s.id)).length;
  const mk = (k, label) => `<button class="chip ${filter === k ? 'on' : ''}" data-f="${k}">${label}<b>${got(k)}/${counts[k]}</b></button>`;

function renderProgress() {

  el.pcEgg.innerHTML = drawEgg(Math.min(4, Math.floor(pct * 4) + 1), 'progress');

  el.rockMarks.innerHTML = marks.map((m, i) =>

let busy = false;
function runCatch(sp) {
  if (busy) return; busy = true;
  const pal = PAL[(sp.o && sp.o.p) || 0] || PAL[0];
  const S = el.scene;
  S.hidden = false;
  el.sceneTarget.className = 'scene-target idle';
  el.sceneTarget.innerHTML = drawSpecies(sp, 'ghost');
  el.sceneName.className = 'scene-name';
  el.sceneName.textContent = '';
  el.sceneFlash.className = 'scene-flash';
  el.confetti.innerHTML = '';
  el.sceneEgg.className = 'scene-egg';
  el.sceneEgg.innerHTML = drawEgg(sp.r, sp.id);

  const step = (fn, ms) => setTimeout(fn, ms);

  step(() => { el.sceneEgg.className = 'scene-egg throw'; blip(520, .1); }, 120);
  step(() => { blip(300, .08); }, 640);
  step(() => { el.sceneEgg.className = 'scene-egg wobble'; }, 760);
  step(() => blip(400, .07), 900);
  step(() => blip(430, .07), 1320);
  step(() => blip(460, .07), 1740);
  step(() => {
    crack();
    el.sceneEgg.innerHTML = drawEggCracked(sp.r, sp.id);
    el.sceneEgg.className = 'scene-egg gone';
    el.sceneFlash.className = 'scene-flash on';
  }, 2060);
  step(() => {
    el.sceneTarget.innerHTML = drawSpecies(sp, 'full', pal);
    el.sceneTarget.className = 'scene-target show';
    el.sceneName.textContent = sp.pl;
    el.sceneName.className = 'scene-name show';
    roar(sp.r);
    confettiBurst(pal);
    markCaught(sp);
  }, 2320);
  step(() => {
    S.hidden = true; busy = false;
    renderAll(sp.id);
    el.msg.innerHTML = `Złapany! <b>${esc(sp.pl)}</b> dołącza do kolekcji.`;
    el.msg.className = 'hunt-msg good';
    openModal(sp);
  }, 3900);
}
function confettiBurst(pal) {
  const colors = [pal[0], pal[1], '#F5A524', '#FFF3D0', '#7FA86B'];
  let html = '';
  for (let i = 0; i < 46; i++) {
    const a = (i / 46) * Math.PI * 2 + Math.random();
    const d = 120 + Math.random() * 260;
    html += `<i style="left:50%;top:48%;background:${colors[i % colors.length]};
      --dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d + 140).toFixed(0)}px;
      --rot:${(Math.random() * 900 - 450).toFixed(0)}deg;
      animation-delay:${(Math.random() * .12).toFixed(2)}s"></i>`;
  }
  el.confetti.innerHTML = html;
  requestAnimationFrame(() => el.confetti.querySelectorAll('i').forEach(n => n.classList.add('go')));
}

function removeSpecies(id) {
  if (!confirm('Usunąć ten gatunek z listy?')) return;
  if (!DB.removed.includes(id)) DB.removed.push(id);
  delete DB.caught[id];
  Store.save(); refreshList(); renderAll();
}
function addSpecies(name, arch, group, latin) {
  const id = 'own_' + norm(name) + '_' + Math.random().toString(36).slice(2, 6);
  const pal = Math.abs(hashStr(name)) % PAL.length;
  const rec = {
    id, pl: name.trim(), lat: (latin || '').trim(), a: arch, g: group,
    o: { p: pal }, r: 2, d: 'R', sz: 6, pw: 7,
    t: ({ dino: 'olbrzym', ptero: 'zwinny', morskie: 'wodny', inne: 'zwinny' })[group] || 'zwinny',
    h: 'Ten zwierzak został dodany przez rodzica', f: 'Dopisaliście go sami — wymyślcie o nim własną ciekawostkę!'
  };
  DB.added.push(rec); Store.save(); refreshList(); renderAll();
  return rec;
}
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }

/* pięciokąt: każdy typ wygrywa z dwoma następnymi w cyklu */
function typeAdv(a, b) {
  if (a === b) return 0;
  const i = TYPE_CYCLE.indexOf(a), j = TYPE_CYCLE.indexOf(b);
  const d = (j - i + 5) % 5;
  return (d === 1 || d === 2) ? 1 : -1;
}
const ADV_TEXT = {
  drap: { olbrzym: 'poluje w stadzie na olbrzymy', pancerz: 'znajduje szczelinę w pancerzu' },
  olbrzym: { pancerz: 'po prostu depcze pancerniki', zwinny: 'jednym ruchem ogona zmiata zwinnych' },
  pancerz: { zwinny: 'maczugą trafia nawet zwinnych', wodny: 'nie da się go ugryźć w wodzie' },
  zwinny: { wodny: 'ucieka na brzeg', drap: 'unika kłów i podgryza' },
  wodny: { drap: 'wciąga drapieżnika pod wodę', olbrzym: 'topi olbrzyma na głębinie' }
};
let arenaA = null, arenaB = null, arenaSlot = 'A';

function closeOverlays() { el.modal.hidden = true; }

function openArena(preId) {

  }
  arenaA = preId ? byId(preId) : null;
  arenaB = null; arenaSlot = arenaA ? 'B' : 'A';

  el.modal.hidden = false;
}
function slotHTML(sp, label) {
  if (!sp) return `<div class="ar-slot"><span class="ph">${label}</span></div>`;
  return `<div class="ar-slot filled" id="slot${label}">

function drawArena(logHTML) {
  const got = LIST.filter(s => isCaught(s.id));
  el.modalBody.innerHTML = `
  <div class="m-body arena">

      <button class="btn amber" id="arFight" ${arenaA && arenaB ? '' : 'disabled style="opacity:.45"'}>Walka!</button>
      <button class="btn ghost" id="arClear">Wyczyść</button>
      <button class="btn ghost" data-close="1">Zamknij</button>
    </div>
    <div class="ar-pick">
      ${got.map(s => `<button data-pick2="${s.id}"><span class="art">${drawSpecies(s, 'full', palOf(s))}</span><span class="nm">${esc(s.pl)}</span></button>`).join('')}
    </div>
    <div class="type-legend">
      ${TYPE_CYCLE.map(t => `<span style="color:${TYPES[t].color}">${TYPES[t].emo} ${TYPES[t].label}</span>`).join('')}
      <span style="opacity:.7">każdy typ bije dwa następne w kółku</span>
    </div>
  </div>`;

  if (c) c.addEventListener('click', () => { arenaA = arenaB = null; arenaSlot = 'A'; drawArena('Wybierz zawodników.'); });
  el.modalBody.querySelectorAll('[data-pick2]').forEach(b => b.addEventListener('click', () => {
    const sp = byId(b.dataset.pick2);

    if (arenaA && arenaB && arenaA.id === arenaB.id) { arenaB = null; arenaSlot = 'B'; }
    blip(560, .06);
    drawArena(arenaA && arenaB ? 'Gotowi? Naciśnij <b>Walka!</b>' : 'Wybierz drugiego zawodnika.');
  }));

function fight() {
  if (!arenaA || !arenaB) return;
  const rollA = 1 + Math.floor(Math.random() * 6), rollB = 1 + Math.floor(Math.random() * 6);
  const advA = typeAdv(arenaA.t, arenaB.t);
  const bonus = 3;
  const sA = arenaA.pw + rollA + (advA > 0 ? bonus : 0);
  const sB = arenaB.pw + rollB + (advA < 0 ? bonus : 0);
  const win = sA === sB ? (arenaA.pw >= arenaB.pw ? arenaA : arenaB) : (sA > sB ? arenaA : arenaB);
  const lose = win === arenaA ? arenaB : arenaA;

  let lines = [];
  if (advA !== 0) {
    const w = advA > 0 ? arenaA : arenaB, l = advA > 0 ? arenaB : arenaA;
    const txt = (ADV_TEXT[w.t] || {})[l.t] || 'ma przewagę typu';
    lines.push(`<span class="li">${TYPES[w.t].emo} <b>${esc(w.pl)}</b> ${txt} — przewaga +${bonus}!</span>`);
  } else {
    lines.push(`<span class="li">Oba to typy <b>${TYPES[arenaA.t].label}</b> — decyduje siła i szczęście.</span>`);
  }
  lines.push(`<span class="li">🎲 ${esc(arenaA.pl)}: ${arenaA.pw}+${rollA}${advA > 0 ? '+' + bonus : ''} = <b>${sA}</b> · ${esc(arenaB.pl)}: ${arenaB.pw}+${rollB}${advA < 0 ? '+' + bonus : ''} = <b>${sB}</b></span>`);
  if (sA === sB) lines.push(`<span class="li">Remis punktowy — rozstrzyga większa siła podstawowa.</span>`);
  lines.push(`<span class="li win">🏆 Wygrywa ${esc(win.pl)}!</span>`);

  DB.wins[win.id] = (DB.wins[win.id] || 0) + 1; Store.save();
  drawArena(lines.join(''));
  const slots = el.modalBody.querySelectorAll('.ar-slot.filled');
  slots.forEach(s => s.classList.add('ar-fight'));
  roar(win.r);
  setTimeout(() => blip(880, .18), 700);
}
el.btnArena.addEventListener('click', () => openArena(null));

/* ================= START ================= */
el.brandEgg.innerHTML = drawEgg(3, 'brand');
renderAll();
el.q.focus({ preventScroll: true });

/* podpowiedź na starcie */
if (Object.keys(DB.caught).length === 0) {
  el.msg.textContent = 'Zacznij od czegoś łatwego — spróbuj wpisać „tyranozaur”.';
  el.msg.className = 'hunt-msg';
}
})();

</script>
</body>
